<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desi Draft — portfolio sheet renderer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Instrument+Serif:ital@0;1&family=Yellowtail&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #eeeae3; color: #0a0a0a; }
      body {
        font-family: 'DM Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      #root { width: 100vw; height: 100vh; }
      .display { font-family: 'Archivo', system-ui, sans-serif; font-weight: 800; letter-spacing: -0.03em; line-height: 0.9; text-transform: lowercase; }
      .serif-i { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; text-transform: none; letter-spacing: -0.01em; }
      .script { font-family: 'Yellowtail', cursive; text-transform: lowercase; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .lbl { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/audit/sheets/sheets.tsx"></script>
  </body>
</html>
